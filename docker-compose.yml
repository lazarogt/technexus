x-default-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      POSTGRES_DB: technexus
      POSTGRES_USER: technexus
      POSTGRES_PASSWORD: technexus
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U technexus -d technexus"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - technexus_internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - technexus_internal

  backend:
    build: ./backend
    container_name: technexus-backend
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./.env.docker
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      BACKEND_PORT: 5000
      POSTGRES_HOST: postgres
      POSTGRES_INTERNAL_PORT: 5432
      DATABASE_URL: postgresql://technexus:technexus@postgres:5432/technexus?schema=public
      REDIS_ENABLED: "true"
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-technexus-local-docker-jwt-secret-2026}
      ANALYTICS_PROVIDER: internal
      DEMO_MODE: ${DEMO_MODE:-false}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
      AUTH_RATE_LIMIT_MAX_REQUESTS: ${AUTH_RATE_LIMIT_MAX_REQUESTS:-10}
      EMAIL_ENABLED: "false"
      TECHNEXUS_ADMIN_EMAIL: admin@example.com
      TECHNEXUS_ADMIN_PASSWORD: DemoAdmin123!
    ports:
      - "5000:5000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 180s
    networks:
      - technexus_internal

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: technexus-frontend
    working_dir: /app
    command:
      [
        "sh",
        "-c",
        "npm run dev -- --host 0.0.0.0 --port 5173"
      ]
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      backend:
        condition: service_healthy
    environment:
      FRONTEND_PORT: 5173
      BACKEND_PORT: 5000
      VITE_API_TARGET: http://backend:5000
      VITE_ANALYTICS_PROVIDER: internal
      VITE_POSTHOG_KEY: ""
      VITE_POSTHOG_HOST: https://app.posthog.com
      VITE_DEMO_MODE: ${DEMO_MODE:-false}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks:
      - technexus_internal

  ngrok:
    profiles: ["ngrok"]
    image: ngrok/ngrok:latest
    container_name: technexus-ngrok
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command: http host.docker.internal:5173
    ports:
      - "4040:4040"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - technexus_internal

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["monitoring"]
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    deploy:
      resources:
        limits:
          memory: 256M
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - technexus_internal

  grafana:
    image: grafana/grafana-oss:11.2.0
    profiles: ["monitoring"]
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - technexus_internal

networks:
  technexus_internal:
    driver: bridge

volumes:
  postgres_data:
  grafana_data:
  frontend_node_modules:
